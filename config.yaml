# CAB Configuration File
# This file centralizes all configuration for the CodeAssistBench project

# API Configuration
api:
  github:
    token: "${GITHUB_TOKEN}"  # Set via environment variable
    base_url: "https://api.github.com"
  
  aws:
    region: "us-east-2"
    bedrock_model: "us.anthropic.claude-3-7-sonnet-20250219-v1:0"
  
  openai:
    api_key: "${OPENAI_API_KEY}"  # Set via environment variable
    model: "gpt-4o"

# Directory Configuration
directories:
  base: "./data"
  repo_data: "${directories.base}/repo"
  issue_data: "${directories.base}/issue"
  results: "${directories.base}/results"
  logs: "${directories.base}/logs"
  docker_data: "${directories.base}/docker"
  commits: "${directories.base}/commits"

# Pipeline Configuration
pipeline:
  max_repos_per_language: 100
  max_issues_per_repo: 50
  max_conversation_rounds: 10
  timeout_seconds: 300
  
# Docker Configuration
docker:
  enabled: true
  build_timeout: 600
  run_timeout: 300
  memory_limit: "4g"
  cpu_limit: "2"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: "${directories.logs}/cab.log"

# Web Interface Configuration
web:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins: ["http://localhost:3000", "http://localhost:8080"]
